name: Plugin CI

on:
  workflow_call:
    inputs:
      skip-test:
        description: Skip test execution
        required: false
        type: boolean
        default: false
      cascades-version:
        description: Cascades platform version override
        required: false
        type: string
        default: ""
      java-version:
        description: Java version for Gradle
        required: false
        type: string
        default: "25"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_URL: https://maven.pkg.github.com/cascades-work/cascades
      GITHUB_ACTOR: no1rstack
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GITLAB_PACKAGES_URL: https://git.noirstack.com/api/v4/projects/7/packages/maven
      GITLAB_TOKEN: ${{ secrets.GITLAB_PACKAGES_TOKEN || secrets.GITLAB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start test service containers
        if: hashFiles('docker-compose-ci.yml') != ''
        run: docker compose -f docker-compose-ci.yml up -d --wait --wait-timeout 300

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          args=(--no-daemon --stacktrace)
          if [[ -n "${{ inputs.cascades-version }}" ]]; then
            args+=("-PcascadesVersion=${{ inputs.cascades-version }}")
          fi
          if [[ "${{ inputs.skip-test }}" == "true" ]]; then
            ./gradlew classes "${args[@]}"
          else
            ./gradlew check "${args[@]}"
          fi
